[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sample-service"
version = "0.1.0"
description = "Deterministic fixture repository for Dependency Upgrade Assistant end-to-end testing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests==2.28.0",
    "pytest==8.2.0",
    "urllib3>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

